[project]
name = "assistente-credito"
version = "0.1.0"
description = "Assistente de dívidas e crédito com LangGraph, MCP e Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4,<5",
    "pydantic>=2",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credito"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-m "not network"'
markers = ["network: consulta a API real do BCB"]
