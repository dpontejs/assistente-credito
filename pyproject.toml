[project]
name = "assistente-credito"
version = "0.1.0"
description = "Assistente de dívidas e crédito com LangGraph, MCP e Streamlit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4,<5",
    "pydantic>=2",
    "httpx",
    "langchain>=1",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.5.2",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.1.1",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "aiosqlite>=0.22.1",
    "pyyaml>=6.0.4",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credito"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = '-m "not network"'
markers = ["network: consulta a API real do BCB"]
